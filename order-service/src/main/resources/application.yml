server:
 port: 8082
 servlet:
  context-path: /order-service

spring:
  application:
    name: order-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  file:
   name: logs/order-service.log
  logback:
   rollingpolicy:
    max-file-size: 10MB
    max-history: 7
   level:
    root: INFO
    com.example: INFO