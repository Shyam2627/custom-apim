spring:
  r2dbc:
    url: r2dbc:h2:mem:///apim-test?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always

app:
  allowed-hosts: user-service,order-service,api.example.com
  services:
    - id: user-service
      path: /api/v1/users/**
      gateway-context-path: users
      uri: forward:/test-target
      upstream-context-path: ""
      required-scope: api.read
    - id: order-service
      path: /api/v1/orders/**
      gateway-context-path: orders
      uri: forward:/test-target
      upstream-context-path: ""
      required-scope: order.read
      strip-prefix: 0
