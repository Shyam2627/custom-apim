server:
 port: 8081
 servlet:
  context-path: /user-service

spring:
  application:
    name: user-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
 file:
  name: logs/user-service.log
 logback:
  rollingpolicy:
   max-file-size: 10MB
   max-history: 7
 level:
  root: INFO
  com.example: INFO